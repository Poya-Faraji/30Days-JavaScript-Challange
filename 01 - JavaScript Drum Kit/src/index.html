<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drum Kit</title>
    <!-- google fonts start -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap"
      rel="stylesheet"
    />
    <!-- google fonts end -->

    <!-- styles -->
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/styles.css" />
    <!-- styles -->
  </head>
  <body>
    <div class="drum-wrapper">
      <div class="key" data-key="a">
        <div class="content">
          <p>A</p>
          <p>boom</p>
        </div>
      </div>
      <div class="key" data-key="s">
        <div class="content">
          <p>S</p>
          <p>clap</p>
        </div>
      </div>
      <div class="key" data-key="d">
        <div class="content">
          <p>D</p>
          <p>hihat</p>
        </div>
      </div>
      <div class="key" data-key="f">
        <div class="content">
          <p>F</p>
          <p>kick</p>
        </div>
      </div>
      <div class="key" data-key="g">
        <div class="content">
          <p>G</p>
          <p>openhat</p>
        </div>
      </div>
      <div class="key" data-key="h">
        <div class="content">
          <p>H</p>
          <p>ride</p>
        </div>
      </div>
      <div class="key" data-key="j">
        <div class="content">
          <p>J</p>
          <p>snare</p>
        </div>
      </div>
      <div class="key" data-key="k">
        <div class="content">
          <p>K</p>
          <p>tink</p>
        </div>
      </div>
      <div class="key" data-key="l">
        <div class="content">
          <p>L</p>
          <p>tom</p>
        </div>
      </div>
    </div>
    <audio data-key="a" src="assets/sounds/boom.wav"></audio>

    <audio data-key="s" src="assets/sounds/clap.wav"></audio>

    <audio data-key="d" src="assets/sounds/hihat.wav"></audio>

    <audio data-key="f" src="assets/sounds/kick.wav"></audio>

    <audio data-key="g" src="assets/sounds/openhat.wav"></audio>

    <audio data-key="h" src="assets/sounds/ride.wav"></audio>

    <audio data-key="j" src="assets/sounds/snare.wav"></audio>

    <audio data-key="k" src="assets/sounds/tink.wav"></audio>

    <audio data-key="l" src="assets/sounds/tom.wav"></audio>

    <script src="scripts/app.js"></script>
  </body>
</html>
